name: Feature request
description: A change to the server, the library, or the repository.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: contract
    attributes:
      label: Does this change search, describe, or execute?
      options:
        - "No"
        - "Yes, and SPEC.md would change with it"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the open issues for this request.
          required: true
