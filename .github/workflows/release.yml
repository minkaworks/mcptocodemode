name: Release

# Pushing a tag vX.Y.Z on a commit of main publishes that version to npm with
# provenance and creates the GitHub release from CHANGELOG.md. No npm token is
# stored: npm trusts this workflow through OIDC (trusted publishing).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/mcptocodemode
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      # This workflow publishes, so actions are pinned to a commit. Dependabot bumps them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Check version, changelog, and package contents
        run: node scripts/release.mjs check "$GITHUB_REF_NAME"
      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "mcptocodemode@$version" version 2>/dev/null)" = "$version" ]; then
            echo "mcptocodemode@$version is already on npm"
          else
            npm publish --provenance --access public
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            node scripts/release.mjs notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
